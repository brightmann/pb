name = "blog-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"


# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "01d15d4d-61bd-48d4-8c1e-4bb7fb325476"

# KV 缓存
[[kv_namespaces]]
binding = "CACHE"
id = "974504e9da7b4565804564b4d28d9544"

# R2 存储: 已禁用 (R2 需要付款方式; 图片上传不可用)

# Durable Object - 原子限流计数器
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# 日志配置
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# 定时任务触发器（每 15 分钟扫描一次到期汇总，daily / weekly 在同一任务内处理）
[triggers]
crons = ["*/15 * * * *"]

# 环境变量（公开的配置）
[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://pb-blog-6ax.pages.dev"
STORAGE_PUBLIC_URL = ""

# Secrets（需要通过命令行或Cloudflare Dashboard设置）
# wrangler secret put JWT_SECRET
# wrangler secret put POST_PASSWORD_SECRET  # 文章密码访问 Token 密钥（可选，默认使用 JWT_SECRET）
# wrangler secret put GITHUB_CLIENT_ID
# wrangler secret put GITHUB_CLIENT_SECRET

# 或者在Cloudflare Dashboard设置:
# Workers & Pages > blog-api > Settings > Variables
# 添加以下环境变量（加密）：
# - JWT_SECRET: 用户认证 JWT 密钥
# - POST_PASSWORD_SECRET: 文章密码访问 Token 密钥（可选）
# - GITHUB_CLIENT_ID: GitHub OAuth Client ID
# - GITHUB_CLIENT_SECRET: GitHub OAuth Client Secret
